<!doctype html>
<html lang="en"><head><style>
html,body{margin:0;min-height:100%;background:#09070a}
body.booting{overflow:hidden;background:#09070a}

#boot-screen .boot-caption{margin-top:12px;font:9px Arial,sans-serif;letter-spacing:.24em;color:#d4a8b5}
